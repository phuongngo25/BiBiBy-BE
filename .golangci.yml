run:
  timeout: 5m
  modules-download-mode: readonly
linters:
  disable-all: true
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - gosimple
    - ineffassign
    - typecheck
linters-settings:
  errcheck:
    check-type-assertions: false
    check-blank: false
issues:
  exclude-use-default: true
  max-issues-per-linter: 50
  max-same-issues: 10
