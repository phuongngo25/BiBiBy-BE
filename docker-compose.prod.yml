name: nutrix-prod

services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-your_password_here}
      POSTGRES_DB: ${POSTGRES_DB:-nutrix}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - nutrix_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-nutrix}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - nutrix

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-nutrix-redis-secret}
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - nutrix_redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD:-nutrix-redis-secret} ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - nutrix

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - nutrix_minio_data:/data
    networks:
      - nutrix

  ai-postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
      POSTGRES_DB: ${AI_POSTGRES_DB:-nutrix}
      POSTGRES_USER: ${AI_POSTGRES_USER:-nutrix}
      POSTGRES_PASSWORD: ${AI_POSTGRES_PASSWORD:-nutrix}
    ports:
      - "${AI_POSTGRES_PORT:-5433}:5432"
    volumes:
      - nutrix_ai_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AI_POSTGRES_USER:-nutrix} -d ${AI_POSTGRES_DB:-nutrix}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - nutrix

  neo4j:
    image: neo4j:5.18.1
    restart: unless-stopped
    # On a user-defined network the container's auto hostname (= container ID) is
    # unknown to Docker's embedded DNS, so neo4j's JVM getLocalHost() fails with
    # "Temporary failure in name resolution" and crashes during logging setup.
    # A fixed hostname + a static /etc/hosts self-mapping makes it resolvable.
    hostname: neo4j
    extra_hosts:
      - "neo4j:127.0.0.1"
    environment:
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-password123}
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474"
      - "${NEO4J_BOLT_PORT:-7687}:7687"
    volumes:
      - nutrix_neo4j_data:/data
      - nutrix_neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u ${NEO4J_USER:-neo4j} -p ${NEO4J_PASSWORD:-password123} 'RETURN 1' >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 30s
    networks:
      - nutrix

  ai-kg:
    build:
      context: ../AI_server
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-password123}
      POSTGRES_URL: ${AI_POSTGRES_URL:-postgresql+asyncpg://nutrix:nutrix@ai-postgres:5432/nutrix}
      PYTHONUNBUFFERED: "1"
      # Off by default — every real food starts at enrichment state NEW, so
      # enabling this triggers one LLM call per distinct food the first time
      # it's validated after deploy. See AI_server/.env.example.
      NUTRIX_ENABLE_MEAL_ENRICHMENT: ${NUTRIX_ENABLE_MEAL_ENRICHMENT:-false}
      NUTRIX_ENRICHMENT_LLM_PROVIDER: ${NUTRIX_ENRICHMENT_LLM_PROVIDER:-gemini}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      # Phase 7 (07-03): local Ollama sidecar fallback, opt-in and off by
      # default. Fires only when the external provider (OpenAI/Gemini)
      # raises -- when disabled, this is zero code-path change (MD-05,
      # P7-I3). Deliberately NO depends_on edge from ai-kg to the `ollama`
      # service below: a `condition: service_healthy` edge would make ai-kg
      # refuse to start whenever the sidecar is unhealthy or absent, the
      # exact opposite of "disabled means unchanged" and of P7-I4 ("a
      # local-model failure must not crash the primary service"). The
      # client is constructed lazily (07-02), so no startup ordering
      # relationship needs to be expressed here.
      NUTRIX_LOCAL_LLM_ENABLED: ${NUTRIX_LOCAL_LLM_ENABLED:-false}
      NUTRIX_LOCAL_LLM_ENDPOINT: ${NUTRIX_LOCAL_LLM_ENDPOINT:-http://ollama:11434}
      NUTRIX_LOCAL_LLM_MODEL: ${NUTRIX_LOCAL_LLM_MODEL:-qwen2.5:7b}
      NUTRIX_LOCAL_LLM_TIMEOUT: ${NUTRIX_LOCAL_LLM_TIMEOUT:-30}
      NUTRIX_LOCAL_LLM_MAX_TOKENS: ${NUTRIX_LOCAL_LLM_MAX_TOKENS:-2000}
    ports:
      - "${GRPC_AI_PORT:-50051}:50051"
    depends_on:
      neo4j:
        condition: service_healthy
      ai-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket; s=socket.create_connection(('127.0.0.1', 50051), 5); s.close()\""]
      interval: 10s
      timeout: 8s
      retries: 20
      start_period: 20s
    networks:
      - nutrix

  ai-cv:
    build:
      context: ../AI_server
      dockerfile: Computer_Vision/Dockerfile
    restart: unless-stopped
    # Expose the host NVIDIA GPU to the container so the CV model runs on CUDA.
    # Requires the NVIDIA driver on the host + GPU support in Docker (WSL2).
    # If no GPU is present the service still starts: worker.py falls back to CPU.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-password123}
      POSTGRES_URL: ${AI_POSTGRES_URL:-postgresql+asyncpg://nutrix:nutrix@ai-postgres:5432/nutrix}
      NUTRIX_GRPC_PORT: "50052"
      NUTRIX_HTTP_HOST: 0.0.0.0
      NUTRIX_HTTP_PORT: "8081"
      NUTRIX_MODEL_DEVICE: ${NUTRIX_MODEL_DEVICE:-cpu}
      # Per-image mass estimation: Nutrition5k regressor on real Depth-Anything
      # depth. Without this the engine defaults to "disabled" and uses the
      # legacy MVDT volume×density path, which is fed a CONSTANT depth (0.5) and
      # collapses to a near-constant volume — so every photo of the same dish
      # returns an identical mass. Weights are bundled in the image at the
      # config.py default paths (CV/weights/nutrition5k_model, depth_anything_v2_relative).
      NUTRIX_DIRECT_MASS_MODE: ${NUTRIX_DIRECT_MASS_MODE:-primary}
      NUTRIX_MINIO_ENDPOINT: http://minio:9000
      NUTRIX_MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      NUTRIX_MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      PYTHONUNBUFFERED: "1"
    ports:
      - "${GRPC_CV_PORT:-50052}:50052"
      - "${NUTRIX_HTTP_PORT:-8081}:8081"
    depends_on:
      neo4j:
        condition: service_healthy
      minio:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket; s=socket.create_connection(('127.0.0.1', 50052), 5); s.close()\""]
      interval: 15s
      timeout: 10s
      retries: 30
      start_period: 60s
    networks:
      - nutrix

  # Phase 7 (07-03): local Ollama inference sidecar, gated behind the
  # `local-llm` compose profile so `docker compose --profile local-llm up`
  # is required to create it at all -- with no profile requested, this
  # service does not exist, which is the deployment-layer half of MD-05's
  # "when disabled, zero change" (P7-I3, P7-I4).
  ollama:
    image: ollama/ollama:0.34.0 # pinned tag, never `latest` (T-07-SC, P-08)
    restart: unless-stopped
    profiles: ["local-llm"]
    # Ollama the *binary* supports CPU-only inference when no GPU is
    # available -- that is a fact about Ollama itself, unaffected by this
    # Compose config. Whether THIS Compose service (which declares an
    # NVIDIA device reservation, copied verbatim from ai-cv above) also
    # starts cleanly on a host with no NVIDIA Container Toolkit/runtime
    # registered is a separate, Docker-Compose-scheduling question -- NOT
    # an Ollama question -- and is UNVERIFIED from YAML alone (D-08
    # clarification, 2026-09-14): `docker compose up` can fail at the
    # container-runtime layer ("could not select device driver with
    # capabilities: [[gpu]]") before Ollama ever gets a chance to fall back
    # to CPU. This is confirmed for real, on the actual target host, only
    # by the 07-03 Task 3 checkpoint -- do not treat CPU-host startup as
    # proven until that checkpoint says so.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      - nutrix_ollama_models:/root/.ollama
    # See AI_server/docker-compose.yml for why `ollama list` is used
    # instead of a curl/wget-based healthcheck (the official image ships
    # neither -- github.com/ollama/ollama issue #9781).
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 30s
    # Deliberately NO ports block. Ollama's API has no authentication, so
    # anyone who can reach port 11434 could enumerate, pull, and run
    # arbitrary models on the host GPU. This is the single most important
    # line (or rather, absent line) of YAML in this service definition
    # (T-07-04, ASVS V4) -- reachable only from inside the `nutrix` bridge
    # network.
    networks:
      - nutrix

  ollama-pull:
    image: ollama/ollama:0.34.0
    restart: "no"
    profiles: ["local-llm"]
    depends_on:
      ollama:
        condition: service_healthy
    # D-02: the model is fetched at runtime, never committed to either
    # repository. The healthcheck above only proves the API answers, not
    # that any model is resident (RESEARCH Assumption A-4) -- this is why
    # the pull is a separate gated step rather than something the
    # healthcheck is trusted to imply.
    entrypoint: ["sh", "-c", "OLLAMA_HOST=http://ollama:11434 ollama pull ${NUTRIX_LOCAL_LLM_MODEL:-qwen2.5:7b}"]
    networks:
      - nutrix

  go-seeder:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["/app/seeder"]
    restart: "no"
    environment:
      - TZ=${TZ:-Asia/Ho_Chi_Minh}
      - DB_DSN=${DB_DSN:-postgres://postgres:your_password_here@postgres:5432/nutrix?sslmode=disable}
      - JWT_SECRET=${JWT_SECRET:-change-this-jwt-secret}
      - ENCRYPTION_KEYS=${ENCRYPTION_KEYS:-{"v1":"0123456789abcdef0123456789abcdef"}}
      - ACTIVE_KEY_VERSION=${ACTIVE_KEY_VERSION:-v1}
      - HMAC_KEY=${HMAC_KEY:-0123456789abcdef0123456789abcdef}
      - GRPC_AI_HOST=ai-kg
      - GRPC_AI_PORT=50051
      - GRPC_CV_HOST=ai-cv
      - GRPC_CV_PORT=50052
      - REDIS_URL=redis:6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-nutrix-redis-secret}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - nutrix

  go-backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - PORT=8080
      - TZ=${TZ:-Asia/Ho_Chi_Minh}
      - DB_DSN=${DB_DSN:-postgres://postgres:your_password_here@postgres:5432/nutrix?sslmode=disable}
      - REDIS_URL=redis:6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-nutrix-redis-secret}
      - JWT_SECRET=${JWT_SECRET:-change-this-jwt-secret}
      - ENCRYPTION_KEYS=${ENCRYPTION_KEYS:-{"v1":"0123456789abcdef0123456789abcdef"}}
      - ACTIVE_KEY_VERSION=${ACTIVE_KEY_VERSION:-v1}
      - HMAC_KEY=${HMAC_KEY:-0123456789abcdef0123456789abcdef}
      - GRPC_AI_HOST=ai-kg
      - GRPC_AI_PORT=50051
      - GRPC_CV_HOST=ai-cv
      - GRPC_CV_PORT=50052
      - RAPIDAPI_KEY=${RAPIDAPI_KEY:-}
    ports:
      - "${PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      go-seeder:
        condition: service_completed_successfully
      ai-kg:
        condition: service_healthy
      ai-cv:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ping >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - nutrix

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: >
      tunnel --no-autoupdate
      --metrics 0.0.0.0:20241
      run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    environment:
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
    ports:
      - "20241:20241"
    # The tunnel's ingress rule (configured on the Cloudflare dashboard) points
    # to http://host.docker.internal:8090 (the edge nginx on the host). Docker
    # Desktop (Mac/Windows) resolves that name for free; native Linux Docker
    # does not, so cloudflared fails DNS lookup unless this is added explicitly.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      go-backend:
        condition: service_healthy
    networks:
      - nutrix

networks:
  nutrix:
    driver: bridge

volumes:
  nutrix_postgres_data:
  nutrix_redis_data:
  nutrix_minio_data:
  nutrix_ai_postgres_data:
  nutrix_neo4j_data:
  nutrix_neo4j_logs:
  nutrix_ollama_models:
